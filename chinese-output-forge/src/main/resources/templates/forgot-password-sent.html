<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title th:text="#{password.reset.sent.pageTitle}">
        メール送信完了 | Chinese Output Forge
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

</head>

<body>

<div class="text-center"
     layout:fragment="content">

    <h1 th:text="#{password.reset.sent.title}">
        メールを送信しました
    </h1>

    <p class="mt-4">
        <span th:text="${email}">
            example@example.com
        </span>
        <span th:text="#{password.reset.sent.message}">
            にパスワード再設定用のメールを送信しました。
        </span>
    </p>

    <p th:text="#{password.reset.sent.description}">
        メールに記載されているURLから、新しいパスワードを設定してください。
    </p>

    <div class="d-grid gap-3 col-md-4 mx-auto mt-4">

        <a th:href="@{/login}"
           class="btn btn-primary"
           th:text="#{password.reset.sent.backToLogin}">
            ログイン画面に戻る
        </a>

        <a th:href="@{/}"
           class="btn btn-outline-secondary"
           th:text="#{common.backToTop}">
            Topに戻る
        </a>

    </div>

</div>

</body>

</html>
