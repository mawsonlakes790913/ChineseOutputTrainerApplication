<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title>ユーザー一覧</title>

    <link rel="stylesheet" th:href="@{/css/study.css}">

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <script th:src="@{/js/study.js}" defer></script>

</head>

<body>

    <div layout:fragment="content">

        <div class="header border-bottom">

            <h1 class="h2">ユーザー一覧画面</h1>
            
			<!-- 成功メッセージ -->
			<div th:if="${successMessage}"
			     class="alert alert-success"
			     role="alert"
			     th:text="${successMessage}">
			</div>            
            
			<!-- ========================= -->
			<!-- 検索フォーム -->
			<!-- ========================= -->
			
			<form th:action="@{/admin/user/list}"
			      th:object="${searchDto}"
			      method="get"
			      class="mb-4">
			
			    <div class="row g-3 align-items-end">
			
			        <!-- ログインID -->
			        <div class="col-md-5">
			
			            <label for="loginId"
			                   class="form-label">
			                ログインID
			            </label>
			
			            <input type="text"
			                   id="loginId"
			                   th:field="*{loginId}"
			                   class="form-control"
			                   placeholder="ログインIDを入力">
			
			        </div>
			
			        <!-- アカウント状態 -->
			        <div class="col-md-5">
			
			            <label class="form-label d-block">
			                アカウント状態
			            </label>
			
			            <div class="form-check form-check-inline">
			
			                <input class="form-check-input"
			                       type="radio"
			                       th:field="*{accountStatus}"
			                       value="ALL"
			                       id="statusAll">
			
			                <label class="form-check-label"
			                       for="statusAll">
			                    すべて
			                </label>
			
			            </div>
			
			            <div class="form-check form-check-inline">
			
			                <input class="form-check-input"
			                       type="radio"
			                       th:field="*{accountStatus}"
			                       value="ACTIVE"
			                       id="statusActive">
			
			                <label class="form-check-label"
			                       for="statusActive">
			                    有効
			                </label>
			
			            </div>
			
			            <div class="form-check form-check-inline">
			
			                <input class="form-check-input"
			                       type="radio"
			                       th:field="*{accountStatus}"
			                       value="LOCKED"
			                       id="statusLocked">
			
			                <label class="form-check-label"
			                       for="statusLocked">
			                    凍結中
			                </label>
			
			            </div>
			
			        </div>
			
			        <!-- 検索 -->
			        <div class="col-md-2">
			
			            <button type="submit"
			                    class="btn btn-primary w-100">
			                検索
			            </button>
			
			        </div>
			
			    </div>
			
			</form>            

            <!-- 一覧表示 -->
            <div>

                <table class="table table-striped table-bordered table-hover text-center">

                    <thead>

                        <tr>

                            <th>ユーザーID</th>

                            <th>Role</th>

                            <th>状態</th>

                            <th>凍結</th>

                            <th>削除</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="item : ${userList}">

                            <td th:text="${item.loginId}"></td>

                            <td th:text="${item.role}"></td>

                            <td>

                                <span th:if="${item.accountLocked}"
                                      class="text-danger fw-bold">
                                    凍結中
                                </span>

                                <span th:unless="${item.accountLocked}">
                                    有効
                                </span>

                            </td>

                            <!-- 凍結 / 凍結解除 -->
							<td>
							
							    <!-- ADMINは操作不可 -->
							    <span th:if="${item.role.name() == 'ADMIN'}">
							        -
							    </span>
							
							    <!-- 有効ユーザー -->
							    <form th:if="${item.role.name() != 'ADMIN' and !item.accountLocked}"
							          th:action="@{/admin/user/lock}"
							          method="post">
							
							        <input type="hidden"
							               name="userId"
							               th:value="${item.id}">
							
							        <button type="submit"
							                class="btn btn-warning"
							                onclick="return confirm('ユーザーを凍結しますか？');">
							            凍結
							        </button>
							
							    </form>
							
							    <!-- 凍結中ユーザー -->
							    <form th:if="${item.role.name() != 'ADMIN' and item.accountLocked}"
							          th:action="@{/admin/user/unlock}"
							          method="post">
							
							        <input type="hidden"
							               name="userId"
							               th:value="${item.id}">
							
							        <button type="submit"
							                class="btn btn-success"
							                onclick="return confirm('ユーザーの凍結を解除しますか？');">
							            凍結解除
							        </button>
							
							    </form>
							
							</td>

                            <!-- 削除 -->
							<td>
							    <span th:if="${item.role.name() == 'ADMIN'}">
							        -
							    </span>
							
							    <form th:if="${item.role.name() != 'ADMIN'}"
							          th:action="@{/admin/user/delete}"
							          method="post">
							
							        <input type="hidden"
							               name="userId"
							               th:value="${item.id}">
							
							        <button type="submit"
							                class="btn btn-danger"
							                onclick="return confirm('ユーザーを削除しますか？');">
							            削除
							        </button>
							    </form>
							</td>

                        </tr>

                    </tbody>

                </table>

				<!-- ========================= -->
				<!-- ページネーション -->
				<!-- ========================= -->
				
				<nav class="mt-4 mb-5"
				     th:if="${page.totalPages > 0}">
				
				    <ul class="pagination justify-content-center">
				
				        <!-- 前へ -->
				        <li class="page-item"
				            th:classappend="${page.first} ? ' disabled'">
				
							<a class="page-link"
							   th:href="@{/admin/user/list(
							       page=${page.number - 1},
							       size=${page.size},
							       loginId=${searchDto.loginId},
							       accountStatus=${searchDto.accountStatus}
							   )}">
							    前へ
							</a>
				
				        </li>
				
				
				        <!-- 1ページ目 -->
				        <li class="page-item"
				            th:classappend="${page.number == 0} ? ' active'">
				
							<a class="page-link"
							   th:href="@{/admin/user/list(
							       page=0,
							       size=${page.size},
							       loginId=${searchDto.loginId},
							       accountStatus=${searchDto.accountStatus}
							   )}">
							    1
							</a>
				
				        </li>
				
				
				        <!-- ... 先頭側 -->
				        <li class="page-item disabled"
				            th:if="${pagination.showFirstEllipsis}">
				
				            <span class="page-link">...</span>
				
				        </li>
				
				
				        <!-- 中央のページ番号 -->
				        <li class="page-item"
				            th:each="i : ${#numbers.sequence(
				                pagination.displayStartPage,
				                pagination.displayEndPage)}"
				            th:if="${i != 0 and i != page.totalPages - 1}"
				            th:classappend="${i == pagination.currentPage} ? ' active'">
				
							<a class="page-link"
							   th:href="@{/admin/user/list(
							       page=${i},
							       size=${page.size},
							       loginId=${searchDto.loginId},
							       accountStatus=${searchDto.accountStatus}
							   )}"
							   th:text="${i + 1}">
							</a>
				
				        </li>
				
				
				        <!-- ... 末尾側 -->
				        <li class="page-item disabled"
				            th:if="${pagination.showLastEllipsis}">
				
				            <span class="page-link">...</span>
				
				        </li>
				
				
				        <!-- 最終ページ -->
				        <li class="page-item"
				            th:if="${page.totalPages > 1}"
				            th:classappend="${page.last} ? ' active'">
				
							<a class="page-link"
							   th:href="@{/admin/user/list(
							       page=${page.totalPages - 1},
							       size=${page.size},
							       loginId=${searchDto.loginId},
							       accountStatus=${searchDto.accountStatus}
							   )}"
							   th:text="${page.totalPages}">
							</a>
				
				        </li>
				
				
				        <!-- 次へ -->
				        <li class="page-item"
				            th:classappend="${page.last} ? ' disabled'">
				
							<a class="page-link"
							   th:href="@{/admin/user/list(
							       page=${page.number + 1},
							       size=${page.size},
							       loginId=${searchDto.loginId},
							       accountStatus=${searchDto.accountStatus}
							   )}">
							    次へ
							</a>
				
				        </li>
				
				    </ul>
				
				</nav>

                <div class="text-center mt-3 mb-3">

                    <a th:href="@{/admin/menu}"
                       class="btn btn-secondary">
                        adminメニューに戻る
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
