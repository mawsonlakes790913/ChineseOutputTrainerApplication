<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">

    <title th:text="#{practice.question.pageTitle}">
        Chinese Output Forge
    </title>

    <link rel="stylesheet"
          th:href="@{/css/practice.css}">

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script th:src="@{/js/practice.js}" defer></script>
</head>

<body>

<div layout:fragment="content" class="text-center">

    <!-- タイトル -->
    <h1 th:text="#{practice.question.title}">
        通常学習
    </h1>

    <p th:text="#{practice.question.message}">
        頑張りましょう
    </p>


    <div class="mt-3">

        <!-- 現在の問題番号 -->
        <span th:text="${nextPageIndex + '/' + totalPages}">
            1/10
        </span>


        <!-- 日本語問題 -->
        <div class="d-flex justify-content-center align-items-center gap-3">

            <h2 class="mb-0"
                th:text="${question.japaneseText}">
                日本語問題
            </h2>

        </div>


        <!-- 条件 -->
        <div style="min-height:40px;">

            <p th:if="${question.condition != null}">

                <span th:text="#{practice.question.condition}">
                    条件：
                </span>

                <span th:text="${question.condition}">
                    条件
                </span>

            </p>

        </div>


        <!-- 解答 -->
        <div style="min-height:100px;">

            <button id="answerButton"
                    type="button"
                    class="btn btn-primary"
                    onclick="showAnswer()"
                    th:text="#{practice.question.showAnswer}">
                解答を見る
            </button>


            <div id="answerArea"
                 style="display:none;">
				<p class="mb-2"
				   th:if="${pronunciation != null}">
				
				    <span th:text="${pronunciation}">
				        Pronunciation
				    </span>
				
				</p>
                <p class="mb-2">

                    <span th:text="#{practice.question.answer}">
                        解答：
                    </span>

                    <span class="fs-3"
                    	  th:text="${question.chineseText}">
                        Chinese Answer
                    </span>

                </p>


                <!-- 別解 -->
                <p th:if="${question.alternativeAnswer != null}"
                   class="mb-0">
				    <p class="mb-2"
				       th:if="${alternativePronunciation != null}">
				
				        <span class="small"
				        	  th:text="${alternativePronunciation}">
				            Alternative Pronunciation
				        </span>
				
				    </p>                   

				    <p class="mb-0">
				
				        <span th:text="#{practice.question.alternativeAnswer}">
				            別解：
				        </span>
				
				        <span th:text="${question.alternativeAnswer}">
				            Alternative Answer
				        </span>
				
				    </p>

                </p>

            </div>

        </div>

    </div>


    <!-- 前へ・次へ -->
    <div class="mb-5 d-flex justify-content-center gap-4"
         style="margin-top:60px;">

        <!-- 前の問題 -->
        <a th:if="${hasPrevious}"
           th:href="@{/practice/question(page=${nextPageIndex - 2})}"
           class="btn btn-outline-primary"
           th:text="#{practice.question.previous}">
            前の問題へ
        </a>


        <!-- 次の問題 -->
        <a th:if="${hasNext}"
           th:href="@{/practice/question(page=${nextPageIndex})}"
           class="btn btn-outline-primary"
           th:text="#{practice.question.next}">
            次の問題へ
        </a>


        <!-- 完了 -->
        <a th:if="${!hasNext}"
           th:href="@{/practice/complete}"
           class="btn btn-info"
           th:text="#{practice.question.complete}">
            完了
        </a>

    </div>


    <!-- 学習中断・終了 -->
    <div class="d-flex justify-content-center gap-3"
         style="margin-top:90px;">

        <!-- 中断 -->
        <a th:href="@{/practice/suspend(page=${nextPageIndex - 1})}"
           th:attr="onclick=|return confirm('#{practice.question.suspend.confirm}');|"
           class="btn btn-outline-danger btn-sm"
           style="width:100px;"
           th:text="#{practice.question.suspend}">
            中断する
        </a>


        <!-- 終了 -->
        <a th:href="@{/practice/quit}"
           th:attr="onclick=|return confirm('#{practice.question.quit.confirm}');|"
           class="btn btn-outline-danger btn-sm"
           style="width:100px;"
           th:text="#{practice.question.quit}">
            やめる
        </a>

    </div>

</div>

</body>
</html>
