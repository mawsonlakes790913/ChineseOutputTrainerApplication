<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="#{practice.menu.pageTitle}"></title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script th:src="@{/js/practice-menu.js}" defer></script>
</head>

<body>

<div layout:fragment="content">

    <!-- ============================= -->
    <!-- タイトル -->
    <!-- ============================= -->

    <div class="header border-bottom pb-2 mb-2 d-flex justify-content-between align-items-center">

        <h1 class="h2 mb-0">
            <i class="bi bi-chat-dots me-2 text-primary"></i>
            <span th:text="#{practice.menu.title}"></span>
        </h1>


        <!-- 中断中のトレーニング -->
        <div th:if="${canResume}"
             class="d-flex align-items-center gap-3">

            <span class="text-danger fw-bold">

                <span th:text="#{practice.menu.resume.message}"></span>

                (<span th:text="${currentPage + 1}"></span>
                /
                <span th:text="${totalCount}"></span>)

            </span>

            <a th:href="@{/practice/resume}"
               class="btn btn-warning"
               th:text="#{practice.menu.resume.button}">
            </a>

        </div>

    </div>


    <!-- ============================= -->
    <!-- 範囲を指定してトレーニング -->
    <!-- ============================= -->

    <form th:action="@{/practice/start}" method="get">

        <div class="card mb-3">

            <div class="card-body">

                <div class="d-flex align-items-center gap-3 mb-2">

                    <h3 class="mb-0">
                        <i class="bi bi-list-ul me-2"></i>
                        <span th:text="#{practice.menu.range.title}"></span>
                    </h3>

                    <p class="mb-0 text-muted"
                       th:text="#{practice.menu.range.description}">
                    </p>

                </div>


                <!-- ============================= -->
                <!-- 出題方法 -->
                <!-- ============================= -->

                <div class="d-flex mb-3">

                    <div class="card" style="width: 400px;">

                        <div class="card-header"
                             th:text="#{practice.menu.order.title}">
                        </div>

                        <div class="card-body">

                            <!-- 順番 -->
                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="random"
                                       value="false"
                                       id="inOrder"
                                       checked>

                                <label class="form-check-label"
                                       for="inOrder"
                                       th:text="#{practice.menu.order.sequential}">
                                </label>

                            </div>


                            <!-- ランダム -->
                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="random"
                                       value="true"
                                       id="random">

                                <label class="form-check-label"
                                       for="random"
                                       th:text="#{practice.menu.order.random}">
                                </label>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ============================= -->
                <!-- 問題難易度 -->
                <!-- ============================= -->

                <div class="row g-3 mb-3">


                    <!-- ============================= -->
                    <!-- 初級 -->
                    <!-- ============================= -->

                    <div class="col-md-4">

                        <div class="accordion" id="beginnerAccordion">

                            <div class="accordion-item">

                                <h2 class="accordion-header">

                                    <button class="accordion-button collapsed bg-danger-subtle fs-4 py-3"
                                            type="button"
                                            data-bs-toggle="collapse"
                                            data-bs-target="#beginnerCollapse">

                                        <span th:text="#{practice.menu.difficulty.beginner(${practiceMenu.beginnerCount})}">
                                        </span>

                                    </button>

                                </h2>


                                <div id="beginnerCollapse"
                                     class="accordion-collapse collapse">

                                    <div class="accordion-body">

                                        <select id="beginnerRange"
                                                class="form-select"
                                                name="beginnerRange">

                                            <option value=""
                                                    th:text="#{practice.menu.range.select}">
                                            </option>

                                            <option th:each="range : ${practiceMenu.beginnerRanges}"
                                                    th:value="${range.start}"
                                                    th:text="${range.displayText}">
                                            </option>

                                        </select>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- ============================= -->
                    <!-- 中級 -->
                    <!-- ============================= -->

                    <div class="col-md-4">

                        <div class="accordion" id="intermediateAccordion">

                            <div class="accordion-item">

                                <h2 class="accordion-header">

                                    <button class="accordion-button collapsed bg-primary-subtle fs-4 py-3"
                                            type="button"
                                            data-bs-toggle="collapse"
                                            data-bs-target="#intermediateCollapse">

                                        <span th:text="#{practice.menu.difficulty.intermediate(${practiceMenu.intermediateCount})}">
                                        </span>

                                    </button>

                                </h2>


                                <div id="intermediateCollapse"
                                     class="accordion-collapse collapse">

                                    <div class="accordion-body">

                                        <select id="intermediateRange"
                                                class="form-select"
                                                name="intermediateRange">

                                            <option value=""
                                                    th:text="#{practice.menu.range.select}">
                                            </option>

                                            <option th:each="range : ${practiceMenu.intermediateRanges}"
                                                    th:value="${range.start}"
                                                    th:text="${range.displayText}">
                                            </option>

                                        </select>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- ============================= -->
                    <!-- 上級 -->
                    <!-- ============================= -->

                    <div class="col-md-4">

                        <div class="accordion" id="advancedAccordion">

                            <div class="accordion-item">

                                <h2 class="accordion-header">

                                    <button class="accordion-button collapsed bg-success-subtle fs-4 py-3"
                                            type="button"
                                            data-bs-toggle="collapse"
                                            data-bs-target="#advancedCollapse">

                                        <span th:text="#{practice.menu.difficulty.advanced(${practiceMenu.advancedCount})}">
                                        </span>

                                    </button>

                                </h2>


                                <div id="advancedCollapse"
                                     class="accordion-collapse collapse">

                                    <div class="accordion-body">

                                        <select id="advancedRange"
                                                class="form-select"
                                                name="advancedRange">

                                            <option value=""
                                                    th:text="#{practice.menu.range.select}">
                                            </option>

                                            <option th:each="range : ${practiceMenu.advancedRanges}"
                                                    th:value="${range.start}"
                                                    th:text="${range.displayText}">
                                            </option>

                                        </select>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ============================= -->
                <!-- エラーメッセージ -->
                <!-- ============================= -->

                <p th:if="${errorMessage}"
                   class="text-danger fw-bold mb-2 text-center"
                   th:text="${errorMessage}">
                </p>


                <!-- ============================= -->
                <!-- 出題開始 -->
                <!-- ============================= -->

                <div class="text-center mt-2">

                    <button type="submit"
                            class="btn btn-primary btn-lg px-5"
                            th:text="#{practice.menu.start}">
                    </button>

                </div>

            </div>

        </div>

    </form>



    <!-- ============================= -->
	<!-- 未学習トレーニング（ログインユーザーのみ） -->
    <!-- ============================= -->	
	<div sec:authorize="isAuthenticated()" class="mt-3">
		
		<div class="card mb-3">
    		<div class="card-body">
	
			    <div class="d-flex align-items-center gap-3 mb-2">
				    <h3>
					    <i class="bi bi-stars me-2 text-primary"></i>
					    <span th:text="#{practice.menu.unstudied.title}">
						</span>	
					</h3>
				    <p class="mb-0 text-muted">
				 	<span th:text="#{practice.menu.unstudied.description}">
                    </span>		
					</p>
				</div>
			
			    <form th:action="@{/practice/new/start}" method="get">
					
					<div class="d-flex gap-3 mb-3">
					
						<label class="bg-danger-subtle rounded px-3 py-2">
						    <input class="form-check-input me-2"
						           type="checkbox"
						           name="difficulties"
						           value="BEGINNER">
						
						    <span th:text="#{practice.menu.difficulty.beginner(${newQuestionCount.beginnerCount})}">
						        初級 : 0問
						    </span>
						</label>
						
						<label class="bg-primary-subtle rounded px-3 py-2">
						    <input class="form-check-input me-2"
						           type="checkbox"
						           name="difficulties"
						           value="INTERMEDIATE">
						
						    <span th:text="#{practice.menu.difficulty.intermediate(${newQuestionCount.intermediateCount})}">
						        中級 : 0問
						    </span>
						</label>
						
						<label class="bg-success-subtle rounded px-3 py-2">
						    <input class="form-check-input me-2"
						           type="checkbox"
						           name="difficulties"
						           value="ADVANCED">
						
						    <span th:text="#{practice.menu.difficulty.advanced(${newQuestionCount.advancedCount})}">
						        上級 : 0問
						    </span>
						</label>
					
					</div>
					
					<div class="text-center">
						<button type="submit"
						        class="btn btn-primary btn-lg px-5"
						        th:text="#{practice.menu.start}">
						    出題開始
						</button>
					</div>
			
			    </form>
			    
    		</div>
		</div>
	
	</div>
	<!-- ============================= -->
	<!-- 未学習トレーニング（ゲスト向け表示） -->
    <!-- ============================= -->	
    <div sec:authorize="isAnonymous()">

        <div class="card mb-3">

            <div class="card-body">

                <div class="d-flex align-items-center gap-3 mb-2">

                    <h3 class="mb-0">

                        <i class="bi bi-stars me-2 text-primary"></i>
						<span th:text="#{practice.menu.unstudied.title}">
                        </span>
                        <i class="bi bi-lock ms-2 text-primary"></i>                        
                    </h3>


                    <p class="mb-0 text-muted">

                        <span th:text="#{practice.menu.unstudied.description}">
                        </span>

                        <span class="text-danger fw-bold"
                              th:text="#{practice.menu.unstudied.loginRequired}">
                        </span>

                    </p>

                </div>


                <!-- 難易度 -->
                <div class="d-flex gap-3 mb-3">

                    <!-- 初級 -->
                    <label class="bg-danger-subtle rounded px-3 py-2 opacity-50">

                        <input class="form-check-input me-2"
                               type="checkbox"
                               disabled>

                        <span th:text="#{practice.menu.unstudied.beginner}">
                        </span>

                    </label>


                    <!-- 中級 -->
                    <label class="bg-primary-subtle rounded px-3 py-2 opacity-50">

                        <input class="form-check-input me-2"
                               type="checkbox"
                               disabled>

                        <span th:text="#{practice.menu.unstudied.intermediate}">
                        </span>

                    </label>


                    <!-- 上級 -->
                    <label class="bg-success-subtle rounded px-3 py-2 opacity-50">

                        <input class="form-check-input me-2"
                               type="checkbox"
                               disabled>

                        <span th:text="#{practice.menu.unstudied.advanced}">
                        </span>

                    </label>

                </div>


                <!-- 出題開始 -->
                <div class="text-center">

                    <button type="button"
                            class="btn btn-primary btn-lg px-5 opacity-50"
                            disabled
                            th:text="#{practice.menu.start}">
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- Topへ戻る -->
    <!-- ============================= -->

    <div class="text-center mt-5 mb-3">

        <a th:href="@{/}"
           class="btn btn-secondary"
           th:text="#{common.backToTop}">
        </a>

    </div>

</div>

</body>
</html>
