<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title th:text="#{aiPractice.question.pageTitle}">
        Chinese Output Forge
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
          
   	<link rel="stylesheet"
	      th:href="@{/css/question-list-modal.css}">       
          
    <script th:src="@{/js/ai-practice/question.js}" defer></script>
    
    <meta name="_csrf"
      th:content="${_csrf.token}">

	<meta name="_csrf_header"
	      th:content="${_csrf.headerName}">

</head>

<body>

<div layout:fragment="content" class="text-center">

    <!-- タイトル -->
    <h1 th:text="#{aiPractice.question.title}">
        AI問題生成モード
    </h1>

    <p th:text="#{aiPractice.question.message}">
        AIが生成した問題に挑戦しましょう
    </p>

    <div class="mt-3">

        <!-- 問題の難易度 -->
        <span class="badge"
              th:classappend="${question.difficulty.name() == 'BEGINNER'} ? 'bg-danger' :
                              (${question.difficulty.name() == 'INTERMEDIATE'} ? 'bg-primary' : 'bg-success')"
              th:text="${question.difficulty.name() == 'BEGINNER'} ? #{difficulty.beginner} :
                       (${question.difficulty.name() == 'INTERMEDIATE'} ? #{difficulty.intermediate} : #{difficulty.advanced})">
            難易度
        </span>
        
		<span class="badge bg-black">
		    AI
		</span>        

        <!-- 現在の問題番号 -->
        <span th:text="${nextPageIndex + '/' + totalPages}">
            1/10
        </span>

		<!-- 日本語問題 -->
		<div class="d-flex justify-content-center align-items-center gap-3">
		
		    <h2 class="mb-0"
		        th:text="${question.japaneseText}">
		        日本語問題
		    </h2>

			<!-- お気に入り・リスト -->
			<!-- Question保存後に表示 -->
			<div id="favoriteArea"
			     class="d-flex align-items-center gap-2"
			     th:classappend="${savedQuestionId == null} ? 'd-none'"
			     sec:authorize="isAuthenticated()">
			
			    <!-- お気に入りボタン -->
			    <button id="favoriteButton"
			            type="button"
			            class="btn p-0 border-0 bg-transparent"
			            th:data-question-id="${savedQuestionId}">
			
			        <i id="favoriteIcon"
			           class="bi fs-2"
			           th:classappend="${isFavorite}
			               ? 'bi-heart-fill text-danger'
			               : 'bi-heart text-secondary'">
			        </i>
			
			    </button>
			
			    <!-- リストボタン -->
			    <button id="questionListButton"
			            type="button"
			            class="btn p-0 border-0 bg-transparent"
			            th:data-question-id="${savedQuestionId}"
			            data-bs-toggle="modal"
			            data-bs-target="#questionListModal">
			
			        <i class="bi bi-folder-plus fs-2 text-secondary"></i>
			
			    </button>
			
			</div>
		
		</div>

        <!-- 解答 -->
        <div class="mt-4"
             style="min-height:150px;">

            <button id="answerButton"
                    type="button"
                    class="btn btn-primary"
                    onclick="showAnswer()"
                    th:text="#{aiPractice.question.showAnswer}">
                解答を見る
            </button>

            <div id="answerArea"
                 style="display:none;">

                <!-- 発音 -->
                <p class="mb-2"
                   th:if="${pronunciation != null}">

                    <span th:text="${pronunciation}">
                        Pronunciation
                    </span>

                </p>

                <!-- 解答 -->
                <p class="mb-2">

                    <span th:text="#{aiPractice.question.answer}">
                        解答：
                    </span>

                    <span class="fs-3"
                          th:text="${question.chineseText}">
                        Chinese Answer
                    </span>

                </p>
                
				<!-- 生成元問題 -->
				<div class="mt-4 text-muted small">
				
				    <p class="mb-1"
				       th:text="#{aiPractice.question.sourceQuestion}">
				        生成元問題
				    </p>
				    
				    <p class="mb-0"
				       th:text="${question.sourceChineseText}">
				        生成元の中国語
				    </p>				    
				
				    <p class="mb-1"
				       th:text="${question.sourceJapaneseText}">
				        生成元の日本語
				    </p>
				
				</div>     				           

            </div>

        </div>

    </div>
    
	<!-- ============================= -->
	<!-- AI生成問題の保存 -->
	<!-- ============================= -->
	
	<div id="saveQuestionArea"
	     class="mt-4"
	     th:classappend="${savedQuestionId != null} ? 'd-none'">
	
	    <button id="saveQuestionButton"
	            type="button"
	            class="btn btn-outline-primary"
	            th:data-page="${nextPageIndex - 1}"
	            th:text="#{aiPractice.question.save}">
	        この問題を保存する
	    </button>
	
	</div>
	
	<!-- ============================= -->
	<!-- 保存後の操作 -->
	<!-- ============================= -->
	
	<div id="savedQuestionActions"
	     class="mt-3"
	     th:classappend="${savedQuestionId == null} ? 'd-none'">
	
	    <!-- 理解度 -->
	    <div id="evaluationArea"
	         class="mt-1 d-flex justify-content-center gap-5">
	
	        <!-- HARD -->
	        <form th:action="@{/ai-practice/evaluation}" method="post">
	
	            <input type="hidden"
	                   name="questionId"
	                   class="savedQuestionId"
	                   th:value="${savedQuestionId}">
	
	            <input type="hidden"
	                   name="evaluation"
	                   value="HARD">
	
	            <input type="hidden"
	                   name="page"
	                   th:value="${nextPageIndex - 1}">
	
	            <button type="submit"
	                    class="btn btn-danger btn-lg"
	                    th:text="#{practice.question.evaluation.hard}">
	                Hard（難しかった）
	            </button>
	
	        </form>
	
	        <!-- GOOD -->
	        <form th:action="@{/ai-practice/evaluation}" method="post">
	
	            <input type="hidden"
	                   name="questionId"
	                   class="savedQuestionId"
	                   th:value="${savedQuestionId}">
	
	            <input type="hidden"
	                   name="evaluation"
	                   value="GOOD">
	
	            <input type="hidden"
	                   name="page"
	                   th:value="${nextPageIndex - 1}">
	
	            <button type="submit"
	                    class="btn btn-primary btn-lg"
	                    th:text="#{practice.question.evaluation.good}">
	                Good（少し考えた）
	            </button>
	
	        </form>
	
	        <!-- EASY -->
	        <form th:action="@{/ai-practice/evaluation}" method="post">
	
	            <input type="hidden"
	                   name="questionId"
	                   class="savedQuestionId"
	                   th:value="${savedQuestionId}">
	
	            <input type="hidden"
	                   name="evaluation"
	                   value="EASY">
	
	            <input type="hidden"
	                   name="page"
	                   th:value="${nextPageIndex - 1}">
	
	            <button type="submit"
	                    class="btn btn-success btn-lg"
	                    th:text="#{practice.question.evaluation.easy}">
	                Easy（余裕だった）
	            </button>
	
	        </form>
	
	    </div>
	
	</div>    
	
	<!-- ============================= -->
	<!-- 問題リスト選択モーダル -->
	<!-- ============================= -->
	
	<div sec:authorize="isAuthenticated()"
	     class="modal fade"
	     id="questionListModal"
	     tabindex="-1"
	     aria-hidden="true">
	
	    <div class="modal-dialog">
	
	        <div class="modal-content">
	
	            <!-- ヘッダー -->
	            <div class="modal-header">
	
	                <h5 class="modal-title"
	                    th:text="#{questionList.modal.title}">
	                    リスト
	                </h5>
	
	                <button type="button"
	                        class="btn-close"
	                        data-bs-dismiss="modal">
	                </button>
	
	            </div>
	
	            <div class="modal-body text-start">
	
	                <!-- 新規リスト作成 -->
	                <div class="mb-4">
	
	                    <label for="newQuestionListName"
	                           class="form-label"
	                           th:text="#{questionList.modal.newList}">
	                        新しいリスト
	                    </label>
	
	                    <div class="input-group">
	
	                        <input type="text"
	                               id="newQuestionListName"
	                               class="form-control"
	                               th:placeholder="#{questionList.modal.listName}">
	
	                        <button type="button"
	                                id="questionListCreateButton"
	                                class="btn btn-outline-primary"
	                                th:text="#{questionList.modal.create}">
	                            作成
	                        </button>
	
	                    </div>
	
	                </div>
	
	                <hr>
	
	                <!-- リスト一覧 -->
	                <div id="questionListSelectionArea">
	                </div>
	
	            </div>
	
	            <!-- 操作ボタン -->
	            <div class="modal-footer">
	
	                <button type="button"
	                        class="btn btn-secondary"
	                        data-bs-dismiss="modal"
	                        th:text="#{questionList.modal.cancel}">
	                    キャンセル
	                </button>
	
	                <button type="button"
	                        id="questionListSaveButton"
	                        class="btn btn-primary"
	                        th:text="#{questionList.modal.save}">
	                    保存
	                </button>
	
	            </div>
	
	        </div>
	
	    </div>
	
	</div>

    <!-- ============================= -->
    <!-- 前へ・次へ -->
    <!-- ============================= -->

    <div class="mb-5 d-flex justify-content-center gap-4"
         style="margin-top:60px;">

        <!-- 前の問題 -->
        <a th:if="${hasPrevious}"
           th:href="@{/ai-practice/question(page=${nextPageIndex - 2})}"
           class="btn btn-outline-primary"
           th:text="#{aiPractice.question.previous}">
            前の問題へ
        </a>

        <!-- 次の問題 -->
        <a th:if="${hasNext}"
           th:href="@{/ai-practice/question(page=${nextPageIndex})}"
           class="btn btn-outline-primary"
           th:text="#{aiPractice.question.next}">
            次の問題へ
        </a>

        <!-- 完了 -->
        <a th:if="${!hasNext}"
           th:href="@{/ai-practice/complete}"
           class="btn btn-info"
           th:text="#{aiPractice.question.complete}">
            完了
        </a>

    </div>

    <!-- ============================= -->
    <!-- 学習中断・終了 -->
    <!-- ============================= -->

    <div class="d-flex justify-content-center gap-3"
         style="margin-top:40px;">

        <!-- 中断 -->
        <a th:href="@{/ai-practice/suspend(page=${nextPageIndex - 1})}"
           th:attr="onclick=|return confirm('#{aiPractice.question.suspend.confirm}');|"
           class="btn btn-outline-danger btn-sm"
           style="width:100px;"
           th:text="#{aiPractice.question.suspend}">
            中断する
        </a>

        <!-- 終了 -->
        <a th:href="@{/ai-practice/quit}"
           th:attr="onclick=|return confirm('#{aiPractice.question.quit.confirm}');|"
           class="btn btn-outline-danger btn-sm"
           style="width:100px;"
           th:text="#{aiPractice.question.quit}">
            やめる
        </a>

    </div>

</div>

</body>

</html>
