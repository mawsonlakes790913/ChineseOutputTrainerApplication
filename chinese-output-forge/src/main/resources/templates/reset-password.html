<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title th:text="#{password.reset.form.pageTitle}">
        パスワード再設定 | Chinese Output Forge
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <script th:src="@{/js/password-toggle.js}" defer></script>

</head>

<body>

<div layout:fragment="content">

    <div class="col-md-5 mx-auto">

        <h1 class="text-center"
            th:text="#{password.reset.form.title}">
            パスワード再設定
        </h1>

        <p class="text-center"
           th:text="#{password.reset.form.description}">
            新しいパスワードを入力してください。
        </p>

        <form th:action="@{/reset-password}"
              th:object="${resetPasswordForm}"
              method="post"
              class="mt-4">

            <!-- パスワードリセットトークン -->
            <input type="hidden"
                   name="token"
                   th:value="${token}">

			<!-- 新しいパスワード -->
			<div class="mb-3">
			
			    <label for="newPassword"
			           class="form-label"
			           th:text="#{password.reset.form.newPassword}">
			        新しいパスワード
			    </label>
			
			    <div class="input-group">
			        <input type="password"
			               id="newPassword"
			               class="form-control"
			               th:field="*{newPassword}">
			
			        <button type="button"
			                class="btn btn-outline-secondary password-toggle"
			                data-target="newPassword">
			            <i class="bi bi-eye"></i>
			        </button>
			    </div>
			
			    <div class="text-danger"
			         th:if="${#fields.hasErrors('newPassword')}"
			         th:errors="*{newPassword}">
			    </div>
			
			</div>
			
			<!-- 新しいパスワード（確認） -->
			<div class="mb-3">
			
			    <label for="newPasswordConfirm"
			           class="form-label"
			           th:text="#{password.reset.form.newPasswordConfirm}">
			        新しいパスワード（確認）
			    </label>
			
			    <div class="input-group">
			        <input type="password"
			               id="newPasswordConfirm"
			               class="form-control"
			               th:field="*{newPasswordConfirm}">
			
			        <button type="button"
			                class="btn btn-outline-secondary password-toggle"
			                data-target="newPasswordConfirm">
			            <i class="bi bi-eye"></i>
			        </button>
			    </div>
			
			    <div class="text-danger"
			         th:if="${#fields.hasErrors('newPasswordConfirm')}"
			         th:errors="*{newPasswordConfirm}">
			    </div>
			
			</div>

            <!-- PasswordMatch -->
            <div class="text-danger mb-3"
                 th:if="${#fields.hasGlobalErrors()}">

                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}">
                </p>

            </div>

            <!-- 更新 -->
            <div class="d-grid gap-3">

                <button type="submit"
                        class="btn btn-primary"
                        th:text="#{password.reset.form.submit}">
                    パスワードを再設定
                </button>

                <a th:href="@{/login}"
                   class="btn btn-outline-secondary"
                   th:text="#{password.reset.form.backToLogin}">
                    ログイン画面に戻る
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
