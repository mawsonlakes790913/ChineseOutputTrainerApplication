<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="#{questionList.title}">
        問題リスト
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

</head>

<body>

<div layout:fragment="content"
     class="w-100">
      
    <div class="container py-4">

        <h1 class="mb-4"
            th:text="#{questionList.title}">
            問題リスト
        </h1>


        <!-- ========================= -->
        <!-- 成功メッセージ -->
        <!-- ========================= -->

        <div th:if="${successMessage}"
             class="alert alert-success"
             th:text="${successMessage}">
        </div>


        <!-- ========================= -->
        <!-- エラーメッセージ -->
        <!-- ========================= -->

        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>


        <!-- ========================= -->
        <!-- 新規リスト作成 -->
        <!-- ========================= -->

        <div class="mb-3">

            <button type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#createListModal"
                    th:text="#{questionList.create}">
                新しいリストを作成
            </button>

        </div>


        <!-- ========================= -->
        <!-- リストが存在しない場合 -->
        <!-- ========================= -->

        <div th:if="${#lists.isEmpty(questionLists)}"
             class="alert alert-secondary"
             th:text="#{questionList.empty}">
            作成されたリストはありません。
        </div>


        <!-- ========================= -->
        <!-- リスト一覧 -->
        <!-- ========================= -->

        <div th:unless="${#lists.isEmpty(questionLists)}">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th th:text="#{questionList.listName}">
                            リスト名
                        </th>

                        <th th:text="#{questionList.action}">
                            操作
                        </th>

                    </tr>

                </thead>

                <tbody>

                <th:block th:each="questionList : ${questionLists}">

                    <tr>

                        <td th:text="${questionList.listName}">
                            リスト名
                        </td>

                        <td>

                            <!-- 詳細 -->
							<a th:href="@{/user/question-list/detail(listId=${questionList.listId})}"
							   class="btn btn-sm btn-outline-primary"
							   th:text="#{questionList.detail}">
							    詳細
							</a>


                            <!-- 編集 -->
                            <button type="button"
                                    class="btn btn-sm btn-outline-secondary"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editListModal-' + ${questionList.listId}"
                                    th:text="#{questionList.edit}">
                                編集
                            </button>


                            <!-- 削除 -->
                            <form th:action="@{/user/question-list/delete}"
                                  method="post"
                                  class="d-inline">

                                <input type="hidden"
                                       name="listId"
                                       th:value="${questionList.listId}">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        th:onclick="|return confirm('#{questionList.delete.confirm}');|"
                                        th:text="#{questionList.delete}">
                                    削除
                                </button>

                            </form>

                        </td>

                    </tr>


                    <!-- ========================= -->
                    <!-- リスト名編集モーダル -->
                    <!-- ========================= -->

                    <div class="modal fade"
                         th:id="'editListModal-' + ${questionList.listId}"
                         tabindex="-1">

                        <div class="modal-dialog">

                            <div class="modal-content">

                                <form th:action="@{/user/question-list/edit}"
                                      method="post">

                                    <div class="modal-header">

                                        <h5 class="modal-title"
                                            th:text="#{questionList.edit.title}">
                                            リスト名を変更
                                        </h5>

                                        <button type="button"
                                                class="btn-close"
                                                data-bs-dismiss="modal">
                                        </button>

                                    </div>

                                    <div class="modal-body">

                                        <input type="hidden"
                                               name="listId"
                                               th:value="${questionList.listId}">

                                        <label class="form-label"
                                               th:text="#{questionList.edit.listName}">
                                            リスト名
                                        </label>

                                        <input type="text"
                                               name="listName"
                                               class="form-control"
                                               th:value="${questionList.listName}"
                                               maxlength="100"
                                               required>

                                    </div>

                                    <div class="modal-footer">

                                        <button type="button"
                                                class="btn btn-secondary"
                                                data-bs-dismiss="modal"
                                                th:text="#{common.cancel}">
                                            キャンセル
                                        </button>

                                        <button type="submit"
                                                class="btn btn-primary"
                                                th:text="#{questionList.edit.submit}">
                                            変更
                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </th:block>

                </tbody>

            </table>

        </div>


        <!-- ========================= -->
        <!-- 戻る -->
        <!-- ========================= -->

        <div class="text-center mt-3 mb-3">

            <a th:href="@{/user/menu}"
               class="btn btn-secondary"
               th:text="#{questionList.backToMenu}">
                ユーザーメニューに戻る
            </a>

        </div>

    </div>


<!-- ========================= -->
<!-- 新規リスト作成モーダル -->
<!-- ========================= -->

<div class="modal fade"
     id="createListModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <form th:action="@{/user/question-list/create}"
                  method="post">

                <div class="modal-header">

                    <h5 class="modal-title"
                        th:text="#{questionList.create.title}">
                        新しいリストを作成
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <label class="form-label"
                           th:text="#{questionList.create.listName}">
                        リスト名
                    </label>

                    <input type="text"
                           name="listName"
                           class="form-control"
                           maxlength="100"
                           required>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{common.cancel}">
                        キャンセル
                    </button>

                    <button type="submit"
                            class="btn btn-primary"
                            th:text="#{questionList.create.submit}">
                        作成
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
