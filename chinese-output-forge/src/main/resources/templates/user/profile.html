<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title th:text="#{user.profile.title}">
        会員情報確認・編集
    </title>

</head>

<body>

<div layout:fragment="content">

    <div class="container py-4">

        <!-- ========================= -->
        <!-- タイトル -->
        <!-- ========================= -->

        <h1 class="h2 text-center mb-4"
            th:text="#{user.profile.heading}">
            会員情報
        </h1>
        
		<!-- メールアドレス変更完了メッセージ -->
		<div th:if="${messageKey}"
		     class="alert alert-success"
		     th:text="#{${messageKey}}">
		</div>        

        <!-- ========================= -->
        <!-- 会員情報 -->
        <!-- ========================= -->

        <div class="d-flex flex-column align-items-center gap-3">

            <div class="table-responsive w-100">

                <table class="table table-striped table-bordered table-hover align-middle">

                    <tbody>

                    <!-- ユーザーID -->

                    <tr>

                        <th class="align-middle text-center"
                            th:text="#{user.profile.loginId}">
                            ユーザーID
                        </th>

                        <td class="align-middle"
                            th:text="${user.loginId}">
                        </td>

                        <td class="align-middle text-center"
                            style="width:120px;">

                            <a th:href="@{/user/edit/loginId}"
                               class="btn btn-primary"
                               th:text="#{user.profile.edit}">
                                編集
                            </a>

                        </td>

                    </tr>
                    
                    <!-- メールアドレス -->

                    <tr>

                        <th class="align-middle text-center"
                            th:text="#{user.profile.email}">
                            メールアドレス
                        </th>

                        <td class="align-middle"
                            th:text="${user.email}">
                        </td>

                        <td class="align-middle text-center"
                            style="width:120px;">

                            <a th:href="@{/user/edit/email}"
                               class="btn btn-primary"
                               th:text="#{user.profile.edit}">
                                編集
                            </a>

                        </td>

                    </tr>                    


                    <!-- パスワード -->

                    <tr>

                        <th class="align-middle text-center"
                            th:text="#{user.profile.password}">
                            パスワード
                        </th>

                        <td class="align-middle">
                            ************
                        </td>

                        <td class="align-middle text-center"
                            style="width:120px;">

                            <a th:href="@{/user/edit/password}"
                               class="btn btn-primary"
                               th:text="#{user.profile.edit}">
                                編集
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <!-- ========================= -->
            <!-- ユーザーメニューへ戻る -->
            <!-- ========================= -->

            <div class="text-center">

                <a th:href="@{/user/menu}"
                   class="btn btn-secondary"
                   th:text="#{user.profile.back}">
                    ユーザーメニューに戻る
                </a>

            </div>
            
            <!-- ========================= -->
            <!-- 退会する -->
            <!-- ========================= -->           
            
			<div>
				<div sec:authorize="!hasRole('ADMIN')">
				    <form th:action="@{/user/delete}" method="post">
				        <button type="submit"
				                class="btn btn-danger"
				                th:text="#{user.delete.button}"
				                th:onclick="|return confirm('#{user.delete.confirm}');|">
				            退会する
				        </button>
				    </form>
				</div>
			</div>            

        </div>

    </div>

</div>

</body>

</html>
