<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title th:text="#{user.edit.loginId.title}">
        会員情報編集
    </title>

</head>

<body>

    <div layout:fragment="content">

        <div class="header">

            <h1 class="h2"
                th:text="#{user.edit.loginId.heading}">
                ユーザーID変更
            </h1>

            <!-- フォームの横幅を制限 -->
            <div class="mx-auto mt-4"
                 style="max-width: 500px;">

                <form th:action="@{/user/edit/loginId}"
                      th:object="${editLoginIdForm}"
                      method="post">

                    <!-- 現在のユーザーID -->
                    <div class="mb-4">

                        <label class="form-label fw-bold"
                               th:text="#{user.edit.loginId.current}">
                            現在のユーザーID
                        </label>

                        <div class="form-control bg-light"
                             th:text="${currentLoginId}">
                            current_user
                        </div>

                    </div>

                    <!-- 新しいユーザーID -->
                    <div class="mb-4">

                        <label for="loginId"
                               class="form-label fw-bold"
                               th:text="#{user.edit.loginId.new}">
                            新しいユーザーID
                        </label>

                        <input type="text"
                               id="loginId"
                               th:field="*{loginId}"
                               th:placeholder="#{signup.loginId.placeholder}"
                               th:errorclass="is-invalid"
                               class="form-control">
                        <div class="invalid-feedback"
                             th:errors="*{loginId}">
                        </div>

                    </div>

                    <!-- 更新 -->
                    <div class="text-center">

                        <button type="submit"
                                class="btn btn-primary"
                                th:text="#{user.edit.loginId.update}">
                            更新
                        </button>

                        <a th:href="@{/user/profile}"
                           class="btn btn-secondary ms-2"
                           th:text="#{user.edit.loginId.back}">
                            戻る
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
