<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title th:text="#{user.edit.password.title}">
        パスワード変更
    </title>

</head>

<body>

    <div layout:fragment="content">

        <div class="header">

            <h1 class="h2"
                th:text="#{user.edit.password.heading}">
                パスワード変更
            </h1>

            <!-- フォームの横幅を制限 -->
            <div class="mx-auto mt-4"
                 style="max-width: 500px;">

                <form th:action="@{/user/edit/password}"
                      th:object="${editPasswordForm}"
                      method="post">

                    <!-- フォーム全体のエラー -->
                    <div class="alert alert-danger"
                         th:if="${#fields.hasGlobalErrors()}">

                        <div th:each="error : ${#fields.globalErrors()}"
                             th:text="${error}">
                        </div>

                    </div>
					
					<!-- 現在のパスワード -->
					<div class="mb-4">
					
					    <label for="currentPassword"
					           class="form-label fw-bold"
					           th:text="#{user.edit.password.current}">
					        現在のパスワード
					    </label>
					
					    <input type="password"
					           id="currentPassword"
					           th:field="*{currentPassword}"
					           th:errorclass="is-invalid"
					           class="form-control">
					
					    <div class="invalid-feedback"
					         th:errors="*{currentPassword}">
					    </div>
					
					</div>
					
					<!-- 新しいパスワード -->
					<div class="mb-4">
					
					    <label for="newPassword"
					           class="form-label fw-bold"
					           th:text="#{user.edit.password.new}">
					        新しいパスワード
					    </label>
					
					    <input type="password"
					           id="newPassword"
					           th:field="*{newPassword}"
					           th:errorclass="is-invalid"
					           class="form-control">
					
					    <div class="invalid-feedback"
					         th:errors="*{newPassword}">
					    </div>
					
					</div>
					
					<!-- 新しいパスワード（確認） -->
					<div class="mb-4">
					
					    <label for="newPasswordConfirm"
					           class="form-label fw-bold"
					           th:text="#{user.edit.password.confirm}">
					        新しいパスワード（確認）
					    </label>
					
					    <input type="password"
					           id="newPasswordConfirm"
					           th:field="*{newPasswordConfirm}"
					           th:errorclass="is-invalid"
					           class="form-control">
					
					    <div class="invalid-feedback"
					         th:errors="*{newPasswordConfirm}">
					    </div>
					
					</div>

                    <!-- 更新 -->
                    <div class="text-center">

                        <button type="submit"
                                class="btn btn-primary"
                                th:text="#{user.edit.password.update}">
                            更新
                        </button>

                        <a th:href="@{/user/profile}"
                           class="btn btn-secondary ms-2"
                           th:text="#{user.edit.password.back}">
                            戻る
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
