<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">

    <title th:text="#{settings.title}">
        設定
    </title>
</head>

<body>

<div layout:fragment="content"
     class="w-100">

    <h2 class="mb-4"
        th:text="#{settings.title}">
        設定
    </h2>

    <div class="table-responsive">

        <table class="table table-bordered align-middle">

            <tbody>

                <!-- ========================= -->
                <!-- 学習対象言語 -->
                <!-- ========================= -->

                <tr>
                    <th class="bg-light w-25"
                        th:text="#{settings.languageVariant}">
                        学習対象言語
                    </th>

                    <td>
						
						<!-- 現在の設定 -->
					    <div class="mb-3">
					        <span class="text-muted"
					              th:text="#{settings.current}">
					            現在の設定：
					        </span>
					
							<strong th:if="${session.languageVariant != null
							                && session.languageVariant.name() == 'MAINLAND'}">
							    🇨🇳 普通话
							</strong>
					
							<strong th:if="${session.languageVariant != null
							                && session.languageVariant.name() == 'TAIWAN'}">
							    🇹🇼 國語
							</strong>
					    </div>
						
						<div class="d-flex flex-wrap gap-3">
						
						    <!-- 普通話 -->
						    <form th:action="@{/language-variant}" method="post">
						
						        <input type="hidden"
						               name="languageVariant"
						               value="MAINLAND">
						
						        <input type="hidden"
						               name="redirect"
						               value="/user/settings">
						
						        <button type="submit"
						                class="btn btn-outline-danger"
						                th:disabled="${session.languageVariant != null
						                    && session.languageVariant.name() == 'MAINLAND'}"
						                th:onclick="return confirm([[#{settings.languageVariant.mainland.confirm}]])">
						            🇨🇳 普通话
						        </button>
						
						    </form>
						
						    <!-- 國語 -->
						    <form th:action="@{/language-variant}" method="post">
						
						        <input type="hidden"
						               name="languageVariant"
						               value="TAIWAN">
						
						        <input type="hidden"
						               name="redirect"
						               value="/user/settings">
						
						        <button type="submit"
						                class="btn btn-outline-success"
						                th:disabled="${session.languageVariant != null
						                    && session.languageVariant.name() == 'TAIWAN'}"
						                th:onclick="return confirm([[#{settings.languageVariant.taiwan.confirm}]])">
						            🇹🇼 國語
						        </button>
						
						    </form>
						
						</div>
                    </td>
                </tr>


                <!-- ========================= -->
                <!-- 表示発音記号 -->
                <!-- ========================= -->

                <tr>
                    <th class="bg-light w-25"
                        th:text="#{settings.pronunciationType}">
                        表示発音記号
                    </th>

                    <td>
						
					    <!-- 現在の設定 -->
					    <div class="mb-3">
					        <span class="text-muted"
					              th:text="#{settings.current}">
					            現在の設定：
					        </span>
					
					        <strong th:switch="${session.pronunciationType != null
					                            ? session.pronunciationType.name()
					                            : 'PINYIN'}">
					
					            <span th:case="'PINYIN'">
					                <ruby>
					                    拼音
					                    <rt>pīnyīn</rt>
					                </ruby>
					            </span>
					
					            <span th:case="'ZHUYIN'">
					                <ruby>
					                    注音
					                    <rt>ㄓㄨˋ ㄧㄣ</rt>
					                </ruby>
					            </span>
					
					            <span th:case="'NONE'"
					                  th:text="#{settings.pronunciationType.none}">
					                表示しない
					            </span>
					
					        </strong>
					    </div>						
						
						<div class="d-flex flex-wrap gap-3">
						
						    <!-- 拼音 -->
						    <form th:action="@{/pronunciation-type}" method="post">
						
						        <input type="hidden"
						               name="pronunciationType"
						               value="PINYIN">
						
						        <button type="submit"
						                class="btn btn-outline-primary px-4"
						                th:disabled="${session.pronunciationType != null
						                    && session.pronunciationType.name() == 'PINYIN'}"
						                th:onclick="return confirm([[#{settings.pronunciationType.pinyin.confirm}]])">
						            <ruby>
						                拼音
						                <rt>pīnyīn</rt>
						            </ruby>
						        </button>
						
						    </form>
						
						    <!-- 注音 -->
						    <form th:action="@{/pronunciation-type}" method="post">
						
						        <input type="hidden"
						               name="pronunciationType"
						               value="ZHUYIN">
						
						        <button type="submit"
						                class="btn btn-outline-info px-4"
						                th:disabled="${session.pronunciationType != null
						                    && session.pronunciationType.name() == 'ZHUYIN'}"
						                th:onclick="return confirm([[#{settings.pronunciationType.zhuyin.confirm}]])">
						            <ruby>
						                注音
						                <rt>ㄓㄨˋ ㄧㄣ</rt>
						            </ruby>
						        </button>
						
						    </form>
						
						    <!-- 表示しない -->
						    <form th:action="@{/pronunciation-type}" method="post">
						
						        <input type="hidden"
						               name="pronunciationType"
						               value="NONE">
						
						        <button type="submit"
						                class="btn btn-outline-secondary"
						                th:disabled="${session.pronunciationType != null
						                    && session.pronunciationType.name() == 'NONE'}"
						                th:onclick="return confirm([[#{settings.pronunciationType.none.confirm}]])"
						                th:text="#{settings.pronunciationType.none}">
						            表示しない
						        </button>
						
						    </form>
						
						</div>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>


    <!-- ========================= -->
    <!-- 戻る -->
    <!-- ========================= -->

    <div class="text-center mt-4 mb-3">

        <a th:href="@{/user/menu}"
           class="btn btn-secondary"
           th:text="#{user.profile.back}">
            ユーザーメニューに戻る
        </a>

    </div>

</div>

</body>

</html>
