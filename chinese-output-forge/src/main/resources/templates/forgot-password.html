<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">

    <title th:text="#{password.reset.request.pageTitle}">
        パスワードを忘れた場合 | Chinese Output Forge
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

</head>

<body>

<div class="text-center"
     layout:fragment="content">

    <h1 th:text="#{password.reset.request.title}">
        パスワードを忘れた場合
    </h1>

    <p th:text="#{password.reset.request.description}">
        登録しているメールアドレスを入力してください。
        パスワード再設定用のURLをメールで送信します。
    </p>

    <form th:action="@{/forgot-password}"
          th:object="${forgotPasswordForm}"
          method="post"
          class="col-md-5 mx-auto mt-4">

        <!-- メールアドレス -->
        <div class="mb-3 text-start">

            <label for="email"
                   class="form-label"
                   th:text="#{password.reset.request.email}">
                メールアドレス
            </label>

            <input type="email"
                   id="email"
                   class="form-control"
                   th:field="*{email}">

            <div class="text-danger mt-1"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>

        </div>

        <!-- 送信 -->
        <div class="d-grid gap-3">

            <button type="submit"
                    class="btn btn-primary"
                    th:text="#{password.reset.request.submit}">
                パスワード再設定メールを送信
            </button>

            <a th:href="@{/login}"
               class="btn btn-outline-secondary"
               th:text="#{password.reset.request.backToLogin}">
                ログイン画面に戻る
            </a>

        </div>

    </form>

</div>

</body>

</html>
