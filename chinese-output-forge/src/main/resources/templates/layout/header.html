<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
</head>
<body>
	<header layout:fragment="header-contents"
	        class="bg-dark text-white py-3 mb-3">
	
	    <div class="container d-flex justify-content-between align-items-center">
			<h1 class="h4 m-0">
			    <a th:href="@{/}"
			       class="text-white text-decoration-none">
			        中文造句工坊
			    </a>
			</h1>
		    <div class="ms-auto d-flex gap-3 align-items-center">	
	    		<span th:text="#{header.greeting.guest}">
	                こんにちは、ゲストさん
	            </span>	
          	

	            <!-- 表示言語切り替え -->
	            <div class="dropdown">
	                <button class="btn btn-outline-light dropdown-toggle"
	                        type="button"
	                        data-bs-toggle="dropdown"
	                        aria-expanded="false">
	                    
	                    <span th:if="${#locale.language == 'ja'}">日本語</span>
	                    <span th:if="${#locale.language == 'en'}">English</span>
	                    <span th:if="${#locale.toString() == 'zh_CN'}">简体中文</span>
	                    <span th:if="${#locale.toString() == 'zh_TW'}">繁體中文</span>
	                </button>

	                <ul class="dropdown-menu dropdown-menu-end">
	                    <li>
	                        <a class="dropdown-item"
	                           th:href="@{?lang=ja}">
	                            日本語
	                        </a>
	                    </li>
	                    <li>
	                        <a class="dropdown-item"
	                           th:href="@{?lang=en}">
	                            English
	                        </a>
	                    </li>
	                    <li>
	                        <a class="dropdown-item"
	                           th:href="@{?lang=zh_CN}">
	                            简体中文
	                        </a>
	                    </li>
	                    <li>
	                        <a class="dropdown-item"
	                           th:href="@{?lang=zh_TW}">
	                            繁體中文
	                        </a>
	                    </li>
	                </ul>
	            </div>	            	
			</div>			
	    </div>	    
	</header>
</body>
</html>
