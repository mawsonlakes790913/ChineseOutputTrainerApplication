<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
</head>
<body>
	<header layout:fragment="header-contents"
	        class="bg-dark text-white py-3 mb-3">
	
	    <div class="container d-flex justify-content-between align-items-center">
			<h1 class="h4 m-0">
			    <a th:href="@{/}"
			       class="text-white text-decoration-none">
			        中文造句工坊
			    </a>
			</h1>
		    <div class="ms-auto d-flex gap-3 align-items-center">	
				<div class="d-flex align-items-center gap-2">
					<!-- 学習対象言語 -->
					<span th:text="#{header.studyLanguage}">
					    学習言語
					</span>
					
					<div class="dropdown">
					
					    <!-- 現在の学習言語 -->
					    <button class="btn btn-outline-light dropdown-toggle"
					            type="button"
					            data-bs-toggle="dropdown"
					            aria-expanded="false">
					
					        <span th:if="${session.languageVariant == null
					                     || session.languageVariant.name() == 'MAINLAND'}">
					            🇨🇳 普通话
					        </span>
					
					        <span th:if="${session.languageVariant != null
					                     && session.languageVariant.name() == 'TAIWAN'}">
					            🇹🇼 國語
					        </span>
					
					    </button>
					
					    <ul class="dropdown-menu dropdown-menu-end">
					
					        <!-- MAINLAND -->
					        <li>
					
					            <span th:if="${session.languageVariant == null
					                         || session.languageVariant.name() == 'MAINLAND'}"
					                  class="dropdown-item disabled">
					                ✓ 🇨🇳 普通话
					            </span>
					
					            <a th:if="${session.languageVariant != null
					                      && session.languageVariant.name() != 'MAINLAND'}"
					               class="dropdown-item language-variant-link"
					               th:href="@{/language-variant(
					                   languageVariant='MAINLAND',
					                   redirect=${languageVariantRedirect}
					               )}"
					               th:data-confirm-message="#{header.studyLanguage.confirmMainland}">
					                🇨🇳 普通话
					            </a>
					
					        </li>
					
					        <!-- TAIWAN -->
					        <li>
					
					            <span th:if="${session.languageVariant != null
					                         && session.languageVariant.name() == 'TAIWAN'}"
					                  class="dropdown-item disabled">
					                ✓ 🇹🇼 國語
					            </span>
					
					            <a th:if="${session.languageVariant == null
					                      || session.languageVariant.name() != 'TAIWAN'}"
					               class="dropdown-item language-variant-link"
					               th:href="@{/language-variant(
					                   languageVariant='TAIWAN',
					                   redirect=${languageVariantRedirect}
					               )}"
					               th:data-confirm-message="#{header.studyLanguage.confirmTaiwan}">
					                🇹🇼 國語
					            </a>
					
					        </li>
					
					    </ul>
					
					</div>
				</div>            	

				
				    <!-- ユーザーアイコン -->
				    <button class="btn btn-outline-light dropdown-toggle"
				            type="button"
				            data-bs-toggle="dropdown"
				            aria-expanded="false">
				        <i class="bi bi-person"></i>
				    </button>
				
				    <ul class="dropdown-menu dropdown-menu-end">
				
						<!-- ログイン中：ユーザーID -->
						<li sec:authorize="isAuthenticated()">
						    <span class="dropdown-item-text fw-bold"
						          sec:authentication="name">
						        userId
						    </span>
						</li>
						
						<!-- 未ログイン：ゲスト -->
						<li sec:authorize="isAnonymous()">
						    <span class="dropdown-item-text fw-bold"
						          th:text="#{header.guest}">
						        ゲスト
						    </span>
						</li>
						
						<li><hr class="dropdown-divider"></li>
						
						<!-- ログイン中：プロフィール -->
						<li sec:authorize="isAuthenticated()">
						    <a class="dropdown-item"
						       th:href="@{/user/profile}"
						       th:text="#{header.profile}">
						        プロフィール
						    </a>
						</li>
						
						<!-- 未ログイン：新規登録 -->
						<li sec:authorize="isAnonymous()">
						    <a class="dropdown-item"
						       th:href="@{/signup}"
						       th:text="#{header.signup}">
						        新規登録
						    </a>
						</li>
				
				    </ul>
				
				</div>				
				<!-- ハンバーガーアイコン -->
				<div class="dropdown">
				    <button type="button"
				            class="btn p-0 text-white border-0"
				            data-bs-toggle="dropdown"
				            aria-expanded="false"
				            aria-label="メニュー">
				        <i class="bi bi-list fs-3"></i>
				    </button>
				
				    <ul class="dropdown-menu dropdown-menu-end">
				
				        <li>
				            <a class="dropdown-item"
				               th:href="@{/about}"
				               th:text="#{home.about}">
				                このアプリについて
				            </a>
				        </li>
				
				        <li><hr class="dropdown-divider"></li>
				
				        <li>
				            <span class="dropdown-header">
				                表示言語
				            </span>
				        </li>
				
				        <li>
				            <a class="dropdown-item"
				               th:href="@{?lang=ja}">
				                <span th:if="${#locale.language == 'ja'}">✓ </span>日本語
				            </a>
				        </li>
				
				        <li>
				            <a class="dropdown-item"
				               th:href="@{?lang=en}">
				                <span th:if="${#locale.language == 'en'}">✓ </span>English
				            </a>
				        </li>
				
				        <li>
				            <a class="dropdown-item"
				               th:href="@{?lang=zh_CN}">
				                <span th:if="${#locale.toString() == 'zh_CN'}">✓ </span>简体中文
				            </a>
				        </li>
				
				        <li>
				            <a class="dropdown-item"
				               th:href="@{?lang=zh_TW}">
				                <span th:if="${#locale.toString() == 'zh_TW'}">✓ </span>繁體中文
				            </a>
				        </li>
				        
				        <li><hr class="dropdown-divider"></li>
						<!-- 未ログイン時 -->
						<li sec:authorize="isAnonymous()">
						    <a class="dropdown-item"
						       th:href="@{/login}"
						       th:text="#{header.login}">
						        ログイン
						    </a>
						</li>
						
						<!-- ログイン時 -->
						<li sec:authorize="isAuthenticated()">
						    <form th:action="@{/logout}" method="post">
						        <button class="dropdown-item"
						        		type="submit"
						                th:text="#{header.logout}">
						            ログアウト
						        </button>
						    </form>
						</li>				        
				
				    </ul>
				</div>			                   	
			</div>			
	    </div>	    
	</header>
</body>
</html>
